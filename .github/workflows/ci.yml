name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cboone/gh-actions/.github/workflows/run-go-ci.yml@844bf31d4ec26df9d0aa531e79d8c3fccf9f0638 # v3.1.0
    with:
      run-format-check: true
      run-scrut: false

  scrut:
    name: Scrut
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install scrut
        shell: bash
        run: |
          set -euo pipefail
          version="0.4.3"
          expected="6aefb0bff29b450fbd1b04083eefeae4388d6c9302e31d1a24b7aa9edd03bb35"
          tarball="scrut-v${version}-linux-x86_64.tar.gz"
          base="https://github.com/facebookincubator/scrut/releases/download/v${version}"
          install_dir="${RUNNER_TEMP}/scrut-bin"
          tarball_path="${RUNNER_TEMP}/${tarball}"
          mkdir -p "${install_dir}"
          curl -sSfL -o "${tarball_path}" "${base}/${tarball}"
          printf '%s  %s\n' "${expected}" "${tarball_path}" | sha256sum --check
          tar -xz -C "${install_dir}" -f "${tarball_path}" --strip-components=1
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run CLI tests through contained fixtures
        run: make test-cli
